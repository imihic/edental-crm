services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: ${CRM_OWNER_PASSWORD:?Run python scripts/setup_local.py first}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?Run python scripts/setup_local.py first}
      POSTGRES_DB: crm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  pgdata:
